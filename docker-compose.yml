version: "3.9"

services:
  gsc-api:
    build: .
    container_name: gsc-api
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - GSC_DIR=/app
      - GSC_DB=/data/gsc_cloud.db
      - PORT=8001
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI:-http://localhost:8081/api/v2/auth/github/callback}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    volumes:
      - gsc_data:/data
      # NOTE: docker.sock intentionally NOT mounted — PoC execution runs in-process
      # (subprocess + rlimits), not via Docker. Mounting the socket would give the
      # API container control of the host Docker daemon (audit S-03).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: gsc-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - gsc_static:/usr/share/nginx/html:ro
    depends_on:
      - gsc-api

volumes:
  gsc_data:
  gsc_static:
