version: "3.9"

services:
  gsc-api:
    build: .
    container_name: gsc-api
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - GSC_DIR=/app
      - GSC_DB=/data/gsc_cloud.db
      # S1: переключение на PostgreSQL — задать GSC_DATABASE_URL (см. .env):
      #   GSC_DATABASE_URL=postgres://gsc:gsc_dev_pw@postgres:5432/gsc
      # При пустом значении server.py работает на SQLite (dev-дефолт).
      # S1 Трек 2: демон gsc-worker поллит scan_jobs; server не спавнит per-scan.
      - GSC_WORKER_DAEMON=1
      - GSC_DATABASE_URL=${GSC_DATABASE_URL:-}
      - PORT=8001
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI:-http://localhost:8081/api/v2/auth/github/callback}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    volumes:
      - gsc_data:/data
      # NOTE: docker.sock intentionally NOT mounted — PoC execution runs in-process
      # (subprocess + rlimits), not via Docker. Mounting the socket would give the
      # API container control of the host Docker daemon (audit S-03).
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # S1 Трек 2 — out-of-process scan worker (демон): поллит scan_jobs из PostgreSQL,
  # без Redis. Долгие clone+scan+store не висят на HTTP worker gsc-api.
  gsc-worker:
    build: .
    container_name: gsc-worker
    restart: unless-stopped
    command: ["python3", "/app/gsc_cloud/gsc_scan_worker.py", "--loop", "5"]
    environment:
      - GSC_DIR=/app
      # Симметрично gsc-api: PG при заданном GSC_DATABASE_URL, иначе SQLite на том же volume.
      - GSC_DB=/data/gsc_cloud.db
      - GSC_DATABASE_URL=${GSC_DATABASE_URL:-}
    volumes:
      - gsc_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Живость: worker всегда пишет heartbeat-строку; проверяем что процесс жив.
      test: ["CMD-SHELL", "pgrep -f gsc_scan_worker > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # PostgreSQL (S1) — опционально: gsc-api переключается на него через
  # GSC_DATABASE_URL. schema_runtime.sql применяется при первом init тома.
  postgres:
    image: postgres:16-alpine
    container_name: gsc-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=gsc
      - POSTGRES_PASSWORD=${GSC_PG_PASSWORD:-gsc_dev_pw}
      - POSTGRES_DB=gsc
    volumes:
      - gsc_pg_data:/var/lib/postgresql/data
      - ./cloud/schema_runtime.sql:/docker-entrypoint-initdb.d/01_runtime.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gsc -d gsc"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  # nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: gsc-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - gsc_static:/usr/share/nginx/html:ro
    depends_on:
      - gsc-api

volumes:
  gsc_data:
  gsc_static:
  gsc_pg_data:
