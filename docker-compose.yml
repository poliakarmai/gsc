version: "3.9"

services:
  gsc-api:
    build: .
    container_name: gsc-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GSC_DIR=/app
      - GSC_DB=/data/gsc_cloud.db
      - PORT=8000
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    volumes:
      - gsc_data:/data
      - /var/run/docker.sock:/var/run/docker.sock  # for isolated scans
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: gsc-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - gsc_static:/usr/share/nginx/html:ro
    depends_on:
      - gsc-api

volumes:
  gsc_data:
  gsc_static:
