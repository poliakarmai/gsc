# GSC Audit Policy v0.20
# Phase 1: warn-only — post comments, never block PRs.

rollout_phase: warn-only
block_min_confidence: 0.80

disabled_rules:
  - GS003

# ── v0.17: GS025 AI-Code Provenance ──
detectors:
  GS025:
    enabled: true
    ai_threshold: 0.5

# ── v0.17: PoC Auto-Generation ──
poc_generation:
  enabled: true
  min_confidence: 0.80
  fail_penalty: 0.90
  redaction_required: true
  include_in_pr_comment: true
  include_in_sarif: false

# ── v0.18: Exploit Chains ──
chains:
  enabled: true
  confirm_threshold: 0.70
  max_findings_per_chain: 3
  max_candidates: 12

# ── v0.19: Mutation Tracking ──
mutation_tracking:
  enabled: true
  lookback_days: 90
  similarity_min: 0.50
  similarity_recurrence: 0.95
  min_confidence: 0.55
  max_findings_per_scan: 50
  max_parent_candidates: 20
  auto_resolve:
    enabled: true
    grace_days: 7
    require_full_scan: true
  blocking: never

