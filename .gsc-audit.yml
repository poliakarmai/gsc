# GSC Audit Policy v0.17
# Phase 1: warn-only — post comments, never block PRs.

rollout_phase: warn-only

block_min_confidence: 0.80

disabled_rules:
  - GS003   # debug prints

# ── v0.17: GS025 AI-Code Provenance ──
detectors:
  GS025:
    enabled: true
    ai_threshold: 0.5               # "likely AI-generated" threshold

# ── v0.17: PoC Auto-Generation ──
poc_generation:
  enabled: true
  min_confidence: 0.80
  fail_penalty: 0.90                # -10% confidence if PoC fails
  redaction_required: true          # block PoC with real secrets
  include_in_pr_comment: true
  include_in_sarif: false

# Budgets are per-profile in gsc_external.py PROFILES:
#   developer-review:  poc_budget=5
#   pr-gate:           poc_budget=3
#   audit:             poc_budget=10
#   candidate-review:  poc_budget=3
