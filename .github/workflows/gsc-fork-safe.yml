name: GSC Fork Safe Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  gsc-fork:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 (pinned, GSC-009)
        with: {fetch-depth: 0}
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0 (pinned, GSC-009)
        with: {python-version: "3.12"}
      - run: pip install requests pyyaml
      - name: GSC Doctor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 gsc_github_adapter.py doctor --github-context "$GITHUB_EVENT_PATH"
      - name: GSC Safe Scan (no LLM)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 gsc_github_adapter.py scan . \
            --github-context "$GITHUB_EVENT_PATH" \
            --profile pr-gate \
            --safe-mode \
            --no-llm \
            --post-comment \
            --create-check
