name: GSC Fork Safe Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

# S-06: least-privilege job split. The scan job runs untrusted fork code with
# contents:read ONLY (no write token exposure). The comment job — trusted, no
# fork code — holds pull-requests:write and posts the pre-built report.

jobs:
  scan:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 (pinned, GSC-009)
        with: {fetch-depth: 0}
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0 (pinned, GSC-009)
        with: {python-version: "3.12"}
      - run: pip install requests pyyaml
      - name: GSC Doctor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 gsc_github_adapter.py doctor --github-context "$GITHUB_EVENT_PATH"
      - name: GSC Safe Scan (no LLM)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 gsc_github_adapter.py scan . \
            --github-context "$GITHUB_EVENT_PATH" \
            --profile pr-gate \
            --safe-mode \
            --no-llm
      - name: Collect report
        run: |
          mkdir -p gsc-report
          COMMENT=$(find ~/.gsc/external -name pr_comment.md | head -1)
          if [ -n "$COMMENT" ]; then cp "$COMMENT" gsc-report/pr_comment.md; fi
          SARIF=$(find ~/.gsc/external -name report.sarif.json | head -1)
          if [ -n "$SARIF" ]; then cp "$SARIF" gsc-report/report.sarif.json; fi
          ls -la gsc-report/ || true
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3 (pinned, GSC-009)
        with:
          name: gsc-report
          path: gsc-report/

  comment:
    runs-on: ubuntu-latest
    needs: scan
    if: github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 (pinned, GSC-009)
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0 (pinned, GSC-009)
        with: {python-version: "3.12"}
      - run: pip install requests pyyaml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0 (pinned, GSC-009)
        with:
          name: gsc-report
          path: gsc-report/
      - name: Post comment + check run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f gsc-report/pr_comment.md ]; then
            python3 gsc_github_adapter.py post-comment \
              --github-context "$GITHUB_EVENT_PATH" \
              --report gsc-report/pr_comment.md
          else
            echo "No report — skipping comment"
          fi
          if [ -f gsc-report/report.sarif.json ]; then
            python3 gsc_github_adapter.py create-check \
              --github-context "$GITHUB_EVENT_PATH" \
              --sarif gsc-report/report.sarif.json \
              --conclusion neutral
          fi
