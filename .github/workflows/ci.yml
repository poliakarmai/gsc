name: CI (test + wheel)

# GSC roadmap 5.5 + 5.8 + 6.8:
#   5.5 — build wheel → install в clean venv → import smoke
#   5.8 — pytest matrix Python 3.10 / 3.11 / 3.12
#   6.8 — pytest green как merge-gate (required check)

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 (pinned, GSC-009)
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0 (pinned, GSC-009)
        with:
          python-version: ${{ matrix.python }}
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Build sandbox image
        run: docker build -t gsc-sandbox:latest sandbox/
      - name: Run tests (coverage gate on core)
        run: |
          python3 -m pytest tests/ -q -rs \
            --cov=gsc_pof_sandbox --cov-report=term-missing \
            --cov-fail-under=58
      - name: Sandbox fail-closed gate (rlimit, GSC-001)
        run: |
          GSC_FORCE_RLIMIT=1 python3 -m pytest \
            tests/test_sandbox_isolation.py::test_verify_fix_fail_closed_without_container \
            -v

  lint:
    name: ruff (undefined/redefined names)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 (pinned, GSC-009)
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0 (pinned, GSC-009)
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff==0.16.4"
      - name: "Lint (pyflakes: undefined/redefined names gate)"
        run: ruff check gsc_core gsc_cli gsc_cloud --select F821,F811,F823

  sca:
    name: SCA gate (reachable MEDIUM+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 (pinned, GSC-009)
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0 (pinned, GSC-009)
        with:
          python-version: "3.12"
      - name: SCA gate (reachable MEDIUM+ blocks merge)
        run: python3 scripts/gsc_sca_gate.py --repo .

  wheel:
    name: build wheel + clean-venv smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 (pinned, GSC-009)
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0 (pinned, GSC-009)
        with:
          python-version: "3.12"
      - name: Install build backend
        run: pip install build
      - name: Build wheel
        run: python3 -m build --wheel
      - name: Generate SBOM (CycloneDX)
        run: python3 scripts/gsc_release_sbom.py
      - name: Install wheel in clean venv + import smoke
        run: |
          python3 -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python - <<'PY'
          import gsc_meta, gsc_db, gsc_pof_sandbox, gsc_scan_worker
          m = gsc_meta.get_meta()
          assert m["detectors_total"] == m["detectors_registry"] + m["detectors_standalone"]
          print(f"smoke OK: v{m['version']}, {m['detectors_total']} detectors, schema v{m['schema']}")
          PY
      - name: Upload wheel artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3 (pinned, GSC-009)
        with:
          name: wheel
          path: dist/*.whl
