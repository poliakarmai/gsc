name: CI (test + wheel)

# GSC roadmap 5.5 + 5.8 + 6.8:
#   5.5 — build wheel → install в clean venv → import smoke
#   5.8 — pytest matrix Python 3.10 / 3.11 / 3.12
#   6.8 — pytest green как merge-gate (required check)

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 (pinned, GSC-009)
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0 (pinned, GSC-009)
        with:
          python-version: ${{ matrix.python }}
      - name: Install deps
        run: pip install -r requirements.txt pytest pytest-cov
      - name: Run tests (coverage gate on core)
        run: |
          python3 -m pytest tests/ -q \
            --cov=gsc_pof_sandbox --cov-report=term-missing \
            --cov-fail-under=60

  wheel:
    name: build wheel + clean-venv smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 (pinned, GSC-009)
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0 (pinned, GSC-009)
        with:
          python-version: "3.12"
      - name: Install build backend
        run: pip install build
      - name: Build wheel
        run: python3 -m build --wheel
      - name: Install wheel in clean venv + import smoke
        run: |
          python3 -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python - <<'PY'
          import gsc_meta, gsc_db, gsc_pof_sandbox, gsc_scan_worker
          m = gsc_meta.get_meta()
          assert m["detectors_total"] == m["detectors_registry"] + m["detectors_standalone"]
          print(f"smoke OK: v{m['version']}, {m['detectors_total']} detectors, schema v{m['schema']}")
          PY
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
