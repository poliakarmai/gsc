name: GSC Internal PR (Phase 5 — blocking-standard)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: gsc-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 (pinned, GSC-009)
        with:
          fetch-depth: 0

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0 (pinned, GSC-009)
        with:
          python-version: "3.11"

      - name: Install GSC
        run: pip install -r requirements.txt

      - name: GSC PR scan (blocking-standard)
        run: |
          gsc github-scan . \
            --profile pr-gate \
            --github-context "$GITHUB_EVENT_PATH" \
            --post-comment --create-check \
            ${{ contains(github.event.pull_request.labels.*.name, 'gsc-bypass') && '' || '--fail-on-blocking' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    # GSC-005: mandatory test gate — pytest + custom-runner suites. A green
    # pytest alone masks ~24 custom-runner files that pytest doesn't collect.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 (pinned, GSC-009)

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0 (pinned, GSC-009)
        with:
          python-version: "3.12"

      - name: Install GSC (full test deps)
        run: pip install -e '.[all]'

      - name: Full test gate (pytest + custom-runner suites)
        run: python3 scripts/run_test_suite.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
