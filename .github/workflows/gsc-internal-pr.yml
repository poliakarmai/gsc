name: GSC Internal PR (Phase 5 — blocking-standard)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: gsc-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GSC
        run: pip install -r requirements.txt

      - name: GSC PR scan (blocking-standard)
        run: |
          gsc external-scan . \
            --profile pr-gate \
            --mode diff --base "origin/${{ github.base_ref }}" --head HEAD \
            --post-comment --create-check \
            --fail-on-blocking \
            ${GSC_BYPASS:+--bypass} \
            -o scan.json
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GSC_BYPASS: >-
            ${{ contains(github.event.pull_request.labels.*.name,
                'gsc-bypass') && '1' || '' }}

      - name: Upload scan artifacts (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsc-pr-${{ github.run_id }}
          path: scan.json
          retention-days: 14
