name: GSC Internal PR (Phase 5 — blocking-standard)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: gsc-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GSC
        run: pip install -r requirements.txt

      - name: GSC PR scan (blocking-standard)
        run: |
          gsc github-scan . \
            --profile pr-gate \
            --github-context "$GITHUB_EVENT_PATH" \
            --post-comment --create-check \
            ${{ contains(github.event.pull_request.labels.*.name, 'gsc-bypass') && '' || '--fail-on-blocking' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
