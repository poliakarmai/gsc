name: GSC Calibration

on:
  pull_request:
    paths:
      - "gsc.py"
      - "gsc_external.py"
      - "gsc_revalidate.py"
      - "gsc_github_adapter.py"
      - "gsc_detectors/**"
      - "scripts/framework_aware.py"
      - "scripts/gsc_metrics.py"
      - "scripts/gsc_calibration.py"
      - "calibration/**"
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 (pinned, GSC-009)

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0 (pinned, GSC-009)
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml || true

      - name: Run calibration
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python3 scripts/gsc_calibration.py run \
            --dataset calibration/calibration_dataset.json \
            --format json \
            --fail-on-regression

      - name: Upload calibration artifacts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3 (pinned, GSC-009)
        with:
          name: calibration-report
          path: calibration/reports/
