# Production overlay — sealed secrets, real domains, higher replicas
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gsc

resources:
  - ../base

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
      spec:
        replicas: 3
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: worker
      spec:
        replicas: 4
  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: api-hpa
      spec:
        minReplicas: 3
        maxReplicas: 20

# In production, use SealedSecrets or ExternalSecrets instead of plain Secret
# secretGenerator:
#   - name: gsc-secrets
#     behavior: replace
#     envs:
#       - .env.prod

# GSC due-diligence шаг 5 (supply chain): base использует mutable :latest.
# Prod ОБЯЗАН пинить immutable digest. Раскомментируйте и подставьте актуальный
# digest (`docker buildx imagetools inspect ghcr.io/poliakarmai/gsc-cloud:tag`):
# images:
#   - name: ghcr.io/poliakarmai/gsc-cloud
#     newName: ghcr.io/poliakarmai/gsc-cloud
#     digest: sha256:<...>
#   - name: ghcr.io/poliakarmai/gsc-dashboard
#     newName: ghcr.io/poliakarmai/gsc-dashboard
#     digest: sha256:<...>