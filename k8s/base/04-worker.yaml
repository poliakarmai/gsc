apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: gsc
  labels:
    app: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/poliakarmai/gsc-cloud:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "gsc_cloud.worker"]
          envFrom:
            - secretRef:
                name: gsc-secrets
            - configMapRef:
                name: gsc-config
          resources:
            requests:
              memory: 512Mi
              cpu: 500m
            limits:
              memory: 2Gi
              cpu: 2000m