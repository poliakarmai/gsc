apiVersion: v1
kind: Namespace
metadata:
  name: gsc
  labels:
    app.kubernetes.io/part-of: gsc-cloud
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gsc-config
  namespace: gsc
data:
  GSC_REDIS_URL: "redis://redis:6379/0"
  GSC_PROFILES: "developer-review,pr-gate,audit,candidate-review"
  GSC_SESSION_SECRET: "change-me-in-sealed-secret"
---
apiVersion: v1
kind: Secret
metadata:
  name: gsc-secrets
  namespace: gsc
type: Opaque
stringData:
  GSC_DATABASE_URL: "postgresql://gsc_app:CHANGE_ME@postgres:5432/gsc"
  DEEPSEEK_API_KEY: ""
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  GSC_OAUTH_CLIENT_ID: ""
  GSC_OAUTH_CLIENT_SECRET: ""
  GSC_GITHUB_APP_PRIVATE_KEY: ""