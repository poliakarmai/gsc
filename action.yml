name: 'GSC Security Audit'
description: 'Self-learning code audit with PoC generation — finds bugs, secrets, injection, XSS, SSTI'
author: 'poliakarmai'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  path:
    description: 'Path to scan (default: repo root)'
    required: false
    default: '.'
  fail_on_critical:
    description: 'Fail workflow on CRITICAL findings'
    required: false
    default: 'false'
  fail_on_score:
    description: 'Fail if score below threshold (0-100)'
    required: false
    default: '0'
  deep_scan:
    description: 'Deep scan (slower, LLM-powered Echelon 4)'
    required: false
    default: 'true'
  sarif:
    description: 'Also emit SARIF (GitHub Code Scanning)'
    required: false
    default: 'false'
  reachability:
    description: 'Downgrade findings in unreachable files (import-graph)'
    required: false
    default: 'false'
  max_findings_to_comment:
    description: 'Max findings in PR comment'
    required: false
    default: '10'
  llm_api_key:
    description: 'Optional API key for LLM revalidation (DeepSeek/OpenAI-compatible). Without it, scan runs regex-only — faster, finds vulns but no confirmed verdicts.'
    required: false
    default: ''
  llm_base_url:
    description: 'Optional custom OpenAI-compatible endpoint (DeepSeek/OpenRouter/GMI/Ollama)'
    required: false
    default: ''
  llm_model:
    description: 'Optional model name for the custom endpoint'
    required: false
    default: ''

outputs:
  score:
    description: 'Security score (0-100)'
  grade:
    description: 'Letter grade (A+ to F)'

runs:
  using: 'composite'
  steps:
    - name: Run GSC Scanner (Docker)
      id: scan
      # Engine ships as a closed-source image on GHCR. The public repo
      # carries only this action.yml — no engine source is exposed.
      run: |
        ARGS="scan ${{ inputs.path }} --ci --json"
        if [ "${{ inputs.deep_scan }}" = "true" ]; then ARGS="$ARGS --deep"; fi
        if [ "${{ inputs.sarif }}" = "true" ]; then ARGS="$ARGS --sarif"; fi
        if [ "${{ inputs.reachability }}" = "true" ]; then ARGS="$ARGS --reachability"; fi
        LLM_ENV=""
        if [ -n "${{ inputs.llm_api_key }}" ]; then
          LLM_ENV="-e DEEPSEEK_API_KEY=${{ inputs.llm_api_key }}"
          [ -n "${{ inputs.llm_base_url }}" ] && LLM_ENV="$LLM_ENV -e LLM_BASE_URL=${{ inputs.llm_base_url }}"
          [ -n "${{ inputs.llm_model }}" ] && LLM_ENV="$LLM_ENV -e LLM_MODEL=${{ inputs.llm_model }}"
        fi
        # :v1, не :latest — иначе результат скана меняется при пересборке образа
        # без изменения workflow. Максимальная строгость:
        # ghcr.io/poliakarmai/gsc-scanner@sha256:<digest>
        docker run --rm $LLM_ENV \
          -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo \
          ghcr.io/poliakarmai/gsc-scanner:v1 \
          $ARGS > "$GITHUB_WORKSPACE/gsc_report.json"
      shell: bash

    - name: Compute Score
      id: score
      run: |
        python3 - <<'PY'
        import json, os
        with open(os.environ["GITHUB_WORKSPACE"] + "/gsc_report.json") as f:
            data = json.load(f)
        # Dedup by code location, exactly like the PR-comment step. Overlapping
        # detectors on one line must not multiply the penalty.
        sev_of = lambda x: (x.get("severity") or x.get("category") or "").upper()
        rank = {"CRITICAL": 0, "HIGH": 1, "MEDIUM": 2, "LOW": 3, "INFO": 4}
        locs = {}
        for x in data:
            path = (x.get("file_path") or x.get("file") or "").replace("/repo/", "", 1)
            line = x.get("line_number") or x.get("line") or 0
            # A finding without a file is still a finding. Only collapse when we
            # actually know the location — otherwise every pathless hit would
            # merge into ":0" and silently disappear from the count.
            key = (f"{path}:{line}" if path
                   else f"?{x.get('title') or x.get('rule_id') or 'unknown'}:{x.get('rule_id') or ''}:{line}")
            s = sev_of(x)
            if key not in locs or rank.get(s, 9) < rank.get(locs[key], 9):
                locs[key] = s
        crit = sum(1 for s in locs.values() if s == "CRITICAL")
        high = sum(1 for s in locs.values() if s == "HIGH")
        score = max(0, 100 - crit * 10 - high * 3)
        grade = "A+" if score >= 97 else "A" if score >= 90 else "B" if score >= 80 else "C" if score >= 70 else "D" if score >= 60 else "F"
        print(f"score={score} grade={grade} critical={crit} high={high} locations={len(locs)}")
        with open(os.environ["GITHUB_OUTPUT"], "a") as o:
            o.write(f"score={score}\n")
            o.write(f"grade={grade}\n")
            o.write(f"critical={crit}\n")
            o.write(f"high={high}\n")
        PY
      shell: bash

    - name: PR Comment
      if: github.event_name == 'pull_request'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v7.0.1 (pinned)
      with:
        script: |
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync(process.env.GITHUB_WORKSPACE + '/gsc_report.json', 'utf8'));
          const sev = f => (f.severity || f.category || 'LOW').toUpperCase();
          // The engine reports absolute container paths (/repo/x.py). Strip to repo-relative
          // so the comment matches the GitHub diff. Also unify `file_path` / `file`.
          const path = f => String(f.file_path || f.file || '').replace(/^\/repo\//, '').replace(/\//g, '/');
          // One code location can trip several overlapping detectors (e.g. GS001 + GS037 on
          // the same secret). Collapse them to one row per file:line, keeping the highest
          // severity and listing the detector titles underneath.
          const rank = { CRITICAL: 0, HIGH: 1, MEDIUM: 2, LOW: 3, INFO: 4 };
          const byLoc = new Map();
          for (const f of raw) {
            const p = path(f);
            const line = f.line_number ?? f.line ?? 0;
            // Pathless findings must not all collapse into one ":0" bucket — that
            // would hide real findings from the comment. Key them by title+rule
            // (two hits at the same pathless location are usually distinct rules).
            const loc = p ? `${p}:${line}` : `?${f.title || f.rule_id || 'unknown'}:${f.rule_id || ''}:${line}`;
            const shown = p ? `${p}:${line}` : (f.title || f.rule_id || 'repository');
            const cur = byLoc.get(loc);
            const s = sev(f);
            if (!cur) {
              byLoc.set(loc, { loc, shown, sev: s, titles: [f.title || f.pattern_title || 'finding'] });
            } else {
              if ((rank[s] ?? 9) < (rank[cur.sev] ?? 9)) cur.sev = s;
              if (f.title && !cur.titles.includes(f.title)) cur.titles.push(f.title);
            }
          }
          const report = [...byLoc.values()];
          const crit = report.filter(f => f.sev === 'CRITICAL');
          const high = report.filter(f => f.sev === 'HIGH');
          const other = report.filter(f => f.sev !== 'CRITICAL' && f.sev !== 'HIGH');
          const maxItems = parseInt('${{ inputs.max_findings_to_comment }}');

          // Every row rendered below is counted in the table — no phantom totals.
          const row = f => `- **${f.titles[0]}** \`${f.shown}\`` +
            (f.titles.length > 1 ? ` _+${f.titles.length - 1} more: ${f.titles.slice(1).join(', ')}_` : '') + '\n';

          let body = '## 🔍 GSC Security Audit\n\n';
          body += `| Severity | Count |\n|----------|-------|\n`;
          body += `| 🔴 CRITICAL | ${crit.length} |\n`;
          body += `| 🟠 HIGH | ${high.length} |\n`;
          body += `| ⚪ MEDIUM/LOW | ${other.length} |\n`;
          body += `| **Total** | **${report.length}** |\n\n`;

          if (crit.length > 0) {
            body += '### 🚨 Critical\n';
            for (const f of crit.slice(0, maxItems)) body += row(f);
            if (crit.length > maxItems) body += `\n*...${crit.length - maxItems} more critical (not shown)*\n`;
          }
          if (high.length > 0) {
            body += '\n### ⚠️ High\n';
            for (const f of high.slice(0, maxItems)) body += row(f);
            if (high.length > maxItems) body += `\n*...${high.length - maxItems} more high (not shown)*\n`;
          }
          if (other.length > 0 && crit.length === 0 && high.length === 0) {
            body += `\n${other.length} MEDIUM/LOW finding(s) — no CRITICAL or HIGH.\n`;
          }

          body += '\n---\n*GSC — [poliakarmai/gsc](https://github.com/poliakarmai/gsc)*';

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const botComment = comments.find(c => c.body.includes('GSC Security Audit'));
          if (botComment) {
            await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: botComment.id, body });
          } else {
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
          }

    - name: Fail on Critical
      if: inputs.fail_on_critical == 'true' && steps.score.outputs.critical != '0'
      run: |
        echo "::error::GSC found ${{ steps.score.outputs.critical }} CRITICAL findings"
        exit 1
      shell: bash
