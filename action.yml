name: 'GSC Security Audit'
description: 'Self-learning code audit with PoC generation — finds bugs, secrets, injection, XSS, SSTI'
author: 'poliakarmai'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  path:
    description: 'Path to scan (default: repo root)'
    required: false
    default: '.'
  fail_on_critical:
    description: 'Fail workflow on CRITICAL findings'
    required: false
    default: 'false'
  fail_on_score:
    description: 'Fail if score below threshold (0-100)'
    required: false
    default: '0'
  with_poc:
    description: 'Generate proof-of-concept exploits'
    required: false
    default: 'true'
  with_chains:
    description: 'Compose attack chains'
    required: false
    default: 'true'
  deep_scan:
    description: 'Deep scan (slower, more thorough)'
    required: false
    default: 'true'
  max_findings_to_comment:
    description: 'Max findings in PR comment'
    required: false
    default: '10'

outputs:
  score:
    description: 'Security score (0-100)'
  grade:
    description: 'Letter grade (A+ to F)'

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0 (pinned, GSC-009)
      with:
        python-version: '3.11'

    - name: Install ripgrep
      run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      shell: bash

    - name: Install GSC
      # GSC-008: pin на immutable commit SHA, а не mutable tag @v1.3.0 —
      # tag можно переместить, SHA нельзя. Обновлять при release.
      # DD-07: --no-deps + pinned requirements.txt (не транзитивные ranges из
      # pyproject.toml) — стабильное дерево зависимостей в CI.
      run: |
        pip install --no-deps git+https://github.com/poliakarmai/gsc.git@b01853667ab281c6da0c70b67ce83f4893a4e5e7
        curl -fsSL -o /tmp/gsc-requirements.txt https://raw.githubusercontent.com/poliakarmai/gsc/master/requirements.txt
        pip install -r /tmp/gsc-requirements.txt
      shell: bash

    - name: Run GSC Scan
      id: scan
      run: |
        cd ${{ inputs.path }}
        python3 -c "
        import subprocess, sys
        args = [sys.executable, '-m', 'gsc', 'scan', '.', '--ci', '--json']
        if '${{ inputs.deep_scan }}' == 'true': args.append('--deep')
        result = subprocess.run(args, capture_output=True, text=True, timeout=300)
        with open('/tmp/gsc_report.json', 'w') as f: f.write(result.stdout)
        import json
        data = json.loads(result.stdout)
        critical = sum(1 for f in data if f.get('category') == 'CRITICAL')
        print(f'total={len(data)}')
        print(f'critical={critical}')
        " > /tmp/gsc_output.txt
        cat /tmp/gsc_output.txt >> $GITHUB_OUTPUT
      shell: bash

    - name: Post Results Summary
      run: |
        python3 scripts/ci_report.py /tmp/gsc_report.json >> $GITHUB_STEP_SUMMARY
      shell: bash
      working-directory: ${{ github.action_path }}

    - name: PR Comment
      if: github.event_name == 'pull_request'
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1 (pinned, GSC-009)
      with:
        script: |
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/gsc_report.json', 'utf8'));
          const critical = report.filter(f => f.category === 'CRITICAL');
          const high = report.filter(f => f.category === 'HIGH');
          const maxItems = parseInt('${{ inputs.max_findings_to_comment }}');

          let body = '## 🔍 GSC Security Audit\n\n';
          body += `| Severity | Count |\n|----------|-------|\n`;
          body += `| 🔴 CRITICAL | ${critical.length} |\n`;
          body += `| 🟠 HIGH | ${high.length} |\n`;
          body += `| **Total** | **${report.length}** |\n\n`;

          if (critical.length > 0) {
            body += '### 🚨 Critical\n';
            for (const f of critical.slice(0, maxItems)) {
              body += `- **${f.title}** \`${f.file_path}:${f.line_number}\`\n`;
            }
            if (critical.length > maxItems) body += `\n*...${critical.length - maxItems} more*\n`;
          }

          if (high.length > 0) {
            body += '\n### ⚠️ High\n';
            for (const f of high.slice(0, maxItems)) {
              body += `- **${f.title}** \`${f.file_path}:${f.line_number}\`\n`;
            }
          }

          body += '\n---\n*GSC v1.4.0 — [poliakarmai/gsc](https://github.com/poliakarmai/gsc)*';

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const botComment = comments.find(c => c.body.includes('GSC Security Audit'));
          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }

    - name: Fail on Critical
      if: inputs.fail_on_critical == 'true' && steps.scan.outputs.critical > 0
      run: |
        echo "::error::GSC found ${{ steps.scan.outputs.critical }} CRITICAL findings"
        exit 1
      shell: bash
