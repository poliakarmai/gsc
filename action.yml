name: 'GSC Security Audit'
description: 'Self-learning code audit with PoC generation — finds bugs, secrets, injection, XSS, SSTI'
author: 'poliakarmai'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  path:
    description: 'Path to scan (default: repo root)'
    required: false
    default: '.'
  fail_on_critical:
    description: 'Fail workflow on CRITICAL findings'
    required: false
    default: 'false'
  fail_on_score:
    description: 'Fail if score below threshold (0-100)'
    required: false
    default: '0'
  deep_scan:
    description: 'Deep scan (slower, LLM-powered Echelon 4)'
    required: false
    default: 'true'
  sarif:
    description: 'Also emit SARIF (GitHub Code Scanning)'
    required: false
    default: 'false'
  reachability:
    description: 'Downgrade findings in unreachable files (import-graph)'
    required: false
    default: 'false'
  max_findings_to_comment:
    description: 'Max findings in PR comment'
    required: false
    default: '10'
  llm_api_key:
    description: 'Optional API key for LLM revalidation (DeepSeek/OpenAI-compatible). Without it, scan runs regex-only — faster, finds vulns but no confirmed verdicts.'
    required: false
    default: ''
  llm_base_url:
    description: 'Optional custom OpenAI-compatible endpoint (DeepSeek/OpenRouter/GMI/Ollama)'
    required: false
    default: ''
  llm_model:
    description: 'Optional model name for the custom endpoint'
    required: false
    default: ''

outputs:
  score:
    description: 'Security score (0-100)'
  grade:
    description: 'Letter grade (A+ to F)'

runs:
  using: 'composite'
  steps:
    - name: Run GSC Scanner (Docker)
      id: scan
      # Engine ships as a closed-source image on GHCR. The public repo
      # carries only this action.yml — no engine source is exposed.
      run: |
        ARGS="scan ${{ inputs.path }} --ci --json"
        if [ "${{ inputs.deep_scan }}" = "true" ]; then ARGS="$ARGS --deep"; fi
        if [ "${{ inputs.sarif }}" = "true" ]; then ARGS="$ARGS --sarif"; fi
        if [ "${{ inputs.reachability }}" = "true" ]; then ARGS="$ARGS --reachability"; fi
        LLM_ENV=""
        if [ -n "${{ inputs.llm_api_key }}" ]; then
          LLM_ENV="-e DEEPSEEK_API_KEY=${{ inputs.llm_api_key }}"
          [ -n "${{ inputs.llm_base_url }}" ] && LLM_ENV="$LLM_ENV -e LLM_BASE_URL=${{ inputs.llm_base_url }}"
          [ -n "${{ inputs.llm_model }}" ] && LLM_ENV="$LLM_ENV -e LLM_MODEL=${{ inputs.llm_model }}"
        fi
        docker run --rm $LLM_ENV \
          -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo \
          ghcr.io/poliakarmai/gsc-scanner:1.4.0 \
          $ARGS > "$GITHUB_WORKSPACE/gsc_report.json"
      shell: bash

    - name: Compute Score
      id: score
      run: |
        python3 - <<'PY'
        import json, os
        with open(os.environ["GITHUB_WORKSPACE"] + "/gsc_report.json") as f:
            data = json.load(f)
        crit = sum(1 for x in data if (x.get("severity") or x.get("category") or "").upper() == "CRITICAL")
        high = sum(1 for x in data if (x.get("severity") or x.get("category") or "").upper() == "HIGH")
        score = max(0, 100 - crit * 10 - high * 3)
        grade = "A+" if score >= 97 else "A" if score >= 90 else "B" if score >= 80 else "C" if score >= 70 else "D" if score >= 60 else "F"
        print(f"score={score} grade={grade} critical={crit}")
        with open(os.environ["GITHUB_OUTPUT"], "a") as o:
            o.write(f"score={score}\n")
            o.write(f"grade={grade}\n")
            o.write(f"critical={crit}\n")
        PY
      shell: bash

    - name: PR Comment
      if: github.event_name == 'pull_request'
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1 (pinned)
      with:
        script: |
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync(process.env.GITHUB_WORKSPACE + '/gsc_report.json', 'utf8'));
          const sev = f => (f.severity || f.category || 'LOW').toUpperCase();
          const crit = report.filter(f => sev(f) === 'CRITICAL');
          const high = report.filter(f => sev(f) === 'HIGH');
          const maxItems = parseInt('${{ inputs.max_findings_to_comment }}');

          let body = '## 🔍 GSC Security Audit\n\n';
          body += `| Severity | Count |\n|----------|-------|\n`;
          body += `| 🔴 CRITICAL | ${crit.length} |\n`;
          body += `| 🟠 HIGH | ${high.length} |\n`;
          body += `| **Total** | **${report.length}** |\n\n`;

          if (crit.length > 0) {
            body += '### 🚨 Critical\n';
            for (const f of crit.slice(0, maxItems)) {
              body += `- **${f.title}** \`${f.file_path}:${f.line_number}\`\n`;
            }
            if (crit.length > maxItems) body += `\n*...${crit.length - maxItems} more*\n`;
          }
          if (high.length > 0) {
            body += '\n### ⚠️ High\n';
            for (const f of high.slice(0, maxItems)) {
              body += `- **${f.title}** \`${f.file_path}:${f.line_number}\`\n`;
            }
          }

          body += '\n---\n*GSC v1.4.0 — [poliakarmai/gsc](https://github.com/poliakarmai/gsc)*';

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const botComment = comments.find(c => c.body.includes('GSC Security Audit'));
          if (botComment) {
            await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: botComment.id, body });
          } else {
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
          }

    - name: Fail on Critical
      if: inputs.fail_on_critical == 'true' && steps.score.outputs.critical != '0'
      run: |
        echo "::error::GSC found ${{ steps.score.outputs.critical }} CRITICAL findings"
        exit 1
      shell: bash
