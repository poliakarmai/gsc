replicaCount: 1

image:
  repository: poliakarmai/gsc
  tag: latest
  pullPolicy: IfNotPresent

schedule: "0 6 * * *"  # Daily at 06:00

gsc:
  projects: []  # List of git repos to audit
  # - name: my-project
  #   url: https://github.com/user/repo.git
  #   branch: main
  openrouter_key: ""  # For E4 LLM analysis

sso:
  enabled: false
  domain: "gsc.example.com"
  redirect_url: "https://gsc.example.com/oauth2/callback"
  cookie_secret: ""  # openssl rand -base64 32
  allowed_groups: ["gsc-admins", "gsc-auditors"]
  oidc:
    issuer_url: "https://accounts.google.com"  # or Okta/Auth0/Azure AD
    client_id: ""
    client_secret: ""

resources: {}
