apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app: gsc-api
    app.kubernetes.io/name: gsc-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: helm
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: gsc-api
  template:
    metadata:
      labels:
        app: gsc-api
        app.kubernetes.io/name: gsc-api
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: helm
    spec:
      containers:
      - name: gsc-api
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8001
          protocol: TCP
        env:
        - name: GSC_DIR
          value: /app
        - name: GSC_DB
          value: /data/gsc_cloud.db
        - name: GSC_WORKER_DAEMON
          value: "1"
        - name: PORT
          value: "8001"
        # GSC_DATABASE_URL is optional: when empty, gsc-api falls back to SQLite
        # on the /data volume (matches docker-compose dev default). Set in
        # values.yaml or via --set gsc.databaseUrl=... to enable PostgreSQL.
        - name: GSC_DATABASE_URL
          value: {{ .Values.gsc.databaseUrl | default "" | quote }}
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
{{ toYaml .Values.resources | indent 10 }}
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      # NOTE: emptyDir is used for dev/single-pod simplicity. In production,
      # replace with a PersistentVolumeClaim (see templates/cronjob.yaml
      # pattern: {{ .Release.Name }}-data) so SQLite DB survives pod restarts
      # and the gsc-worker (separate Deployment) can share the same volume.
      - name: data
        emptyDir: {}
