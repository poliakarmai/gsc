apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-audit
spec:
  schedule: "{{ .Values.schedule }}"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: gsc
            image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
            args:
            {{- range .Values.gsc.projects }}
            - gsc scan {{ .name }} --ci --json --diff
            - gsc triage {{ .name }} --bulk --auto-accept
            {{- end }}
            env:
            - name: OPENROUTER_API_KEY
              value: "{{ .Values.gsc.openrouter_key }}"
            volumeMounts:
            - name: data
              mountPath: /root/.hermes/state
          restartPolicy: OnFailure
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: {{ .Release.Name }}-data
