# Pre-commit hook contract for GSC.
#
# Consumers add this to their .pre-commit-config.yaml:
#
#   - repo: https://github.com/poliakarmai/gsc
#     rev: v1.3.0
#     hooks:
#       - id: gsc-scan
#
# The hook runs `gsc scan . --diff --ci --fail-on-blocking`: it scans the
# files changed since HEAD and exits 1 on any CRITICAL/HIGH finding, blocking
# the commit. Requires `ripgrep` (rg) and `git` on PATH.
- id: gsc-scan
  name: GSC Security Scan
  description: Detect security vulnerabilities (SAST/SCA/IaC) in staged changes
  entry: gsc
  language: python
  args: [scan, ., --diff, --ci, --fail-on-blocking]
  files: '(\.py|\.js|\.ts|\.go|\.java|\.rs|\.tf|\.ya?ml)$'
  types: [file]
  require_serial: true
  pass_filenames: false
  verbose: true
