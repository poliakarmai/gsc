rules:
  - id: no-unsafe-deserialization
    severity: CRITICAL
    confidence: 0.85
    languages:
      - python
    message: "Unsafe deserialization of untrusted data can lead to remote code execution (RCE)"
    patterns:
      - regex: \bpickle\.loads?\s*\(
        title: pickle.load()/loads() — unsafe deserialization
      - regex: \bcPickle\.loads?\s*\(
        title: cPickle.load()/loads() — unsafe deserialization
      - regex: \bmarshal\.loads?\s*\(
        title: marshal.load()/loads() — unsafe deserialization
    not-patterns:
      - regex: yaml\.safe_load
        title: guard — yaml.safe_load is safe
    fix: "Use yaml.safe_load() or a strict schema allowlist instead of pickle/marshal on untrusted input"
    references:
      - https://cwe.mitre.org/data/definitions/502.html
      - https://owasp.org/www-community/vulnerabilities/Deserialization_of_untrusted_data
