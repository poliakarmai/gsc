rules:
- confidence: 0.9
  fix: 'Use safer alternatives: ast.literal_eval() for data, or sandboxed execution'
  id: no-eval-exec
  languages:
  - python
  - javascript
  message: Use of eval() or exec() with dynamic input can lead to code injection
  patterns:
  - regex: \beval\s*\(
    title: eval() call — potential code injection
  - regex: \bexec\s*\(
    title: exec() call — potential code injection
  - regex: \bcompile\s*\([^,]+,\s*['\"](eval|exec|single)['\"]
    title: compile() in exec/eval mode
  references:
  - https://cwe.mitre.org/data/definitions/95.html
  - https://owasp.org/www-community/attacks/Code_Injection
  severity: CRITICAL
- confidence: 0.85
  fix: Set DEBUG = os.environ.get('DEBUG', 'False').lower() == 'true'
  id: no-debug-true
  languages:
  - python
  message: DEBUG=True in production Django/Flask config
  patterns:
  - regex: \bDEBUG\s*=\s*True\b
    title: DEBUG=True — should be False in production
  severity: MEDIUM
- confidence: 0.75
  fix: 'Never log secrets. Use redacted logging: log.debug(''Auth with key: %s'',
    key[:4] + ''***'')'
  id: no-print-secrets
  languages:
  - python
  message: Printing potentially sensitive data to stdout
  patterns:
  - regex: \bprint\s*\(.*(?:password|secret|token|key|api_key)
    title: print() with sensitive variable
  - regex: \blogging\.\w+\(.*(?:password|secret|token|key|api_key)
    title: logging sensitive data
  severity: HIGH
