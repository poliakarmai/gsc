services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gsc
      POSTGRES_USER: gsc_admin
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema_s1.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gsc_admin -d gsc"]

  redis:
    image: redis:7-alpine

  api:
    build:
      context: ..
      dockerfile: cloud/Dockerfile
    command: uvicorn cloud.api:app --host 0.0.0.0 --port 8000
    environment:
      GSC_DATABASE_URL: postgresql://gsc_app:${PG_APP_PASSWORD}@postgres/gsc
      GSC_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ..
      dockerfile: cloud/Dockerfile
    command: python -m cloud.worker
    environment:
      GSC_DATABASE_URL: postgresql://gsc_app:${PG_APP_PASSWORD}@postgres/gsc
      GSC_REDIS_URL: redis://redis:6379/0
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    depends_on:
      - postgres
      - redis
    deploy:
      replicas: 2

volumes:
  pgdata: