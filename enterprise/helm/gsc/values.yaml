replicaCount: 2

image:
  repository: poliakarmai/gsc
  tag: "0.38"
  pullPolicy: IfNotPresent

api:
  port: 8766
  replicas: 2

db:
  type: postgres
  host: gsc-postgres
  port: 5432
  name: gsc
  secretName: gsc-db-credentials

sso:
  enabled: true
  issuerUrl: "https://idp.corp.example.com"
  clientId: "gsc-enterprise"
  secretName: gsc-sso-credentials

airgap:
  enabled: false

vulnBundle:
  enabled: false
  path: /data/vuln-bundle

resources:
  limits: { cpu: "2", memory: "2Gi" }
  requests: { cpu: "500m", memory: "512Mi" }

ingress:
  enabled: true
  host: gsc.corp.example.com
  tls: true
