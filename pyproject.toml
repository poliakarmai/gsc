[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gsc-security"
version = "1.4.0"
description = "Git Security Checker — AI-powered SAST with 42 detectors, auto-PoC, and self-learning"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31",
]
authors = [{name = "Alexey Polyakov", email = "poliakarmai@github.com"}]
keywords = ["security", "audit", "static-analysis", "sast", "sast-tool", "vulnerability-scanner", "appsec", "devsecops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
gsc = "gsc_cli.main:main"

[project.optional-dependencies]
# Audit A-01: runtime surface split by extras — install what you need.
cli = ["httpx>=0.28", "uvicorn>=0.34"]
cloud = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.13",
    "httpx>=0.28",
    "PyJWT>=2.10",
    "stripe>=12.0",
]
collector = ["Scrapy>=2.11"]
# A-03 (audit): MCP + test deps must be declarable for a clean-environment install.
mcp = ["fastmcp>=2.0"]
dev = ["pytest>=8", "pytest-cov>=5", "fakeredis>=2.23", "fastmcp>=2.0"]
all = ["gsc-security[cli,cloud,collector,dev,mcp]"]

[project.urls]
Homepage = "https://github.com/poliakarmai/gsc"
Repository = "https://github.com/poliakarmai/gsc.git"
Issues = "https://github.com/poliakarmai/gsc/issues"
Hall-of-Fame = "https://github.com/poliakarmai/gsc/blob/master/HALL_OF_FAME.md"

[tool.setuptools]
# A-02 (audit): every advertised top-level module must ship in the wheel.
# 0.5.4: disable auto data-include (VCS finder) so dev .py (enterprise/tests) stay out of the wheel.
include-package-data = false
py-modules = [
    "gsc", "server",
    "gsc_agentless", "gsc_api", "gsc_archaeology", "gsc_ast_dataflow",
    "gsc_blocking", "gsc_bounty_loader", "gsc_chain_composer", "gsc_check_run",
    "gsc_collect_bounty", "gsc_collect_light", "gsc_compliance",
    "gsc_crossrepo_secrets", "gsc_dast_scanner", "gsc_dast_validator",
    "gsc_db_backend", "gsc_db", "gsc_deep_reducer", "gsc_edu", "gsc_epss",
    "gsc_exploit_refiner", "gsc_external", "gsc_federated", "gsc_forecast",
    "gsc_github_adapter", "gsc_github_dorks", "gsc_iac", "gsc_invariant_engine",
    "gsc_llm_providers", "gsc_mcp_server", "gsc_meta", "gsc_mutation_tracker",
    "gsc_nlpolicy", "gsc_noise_engine", "gsc_nuclei_export", "gsc_nuclei_import",
    "gsc_orchestrator", "gsc_poc_deterministic", "gsc_poc_generator",
    "gsc_pof_sandbox", "gsc_proofoffix", "gsc_reachability", "gsc_rejudge",
    "gsc_resume", "gsc_revalidate", "gsc_router", "gsc_sbom", "gsc_scan_diff",
    "gsc_scan_modes", "gsc_sca", "gsc_scan_worker", "gsc_secrets_core", "gsc_selfhealing",
    "gsc_shadow_manager", "gsc_spdx", "gsc_supply_chain_chains",
    "gsc_threat_model", "gsc_verify_fix", "gsc_workspace", "gsc_xss_poc",
    "gsc_yaml_rules",
]

[tool.setuptools.packages.find]
include = ["gsc_core*", "gsc_cli*", "gsc_detectors*", "cloud*", "gsc_collector*", "scripts*", "enterprise*"]
exclude = ["tests*", "benchmark*", "calibration*", "build*", "dist*", "OWASPBenchmark*", "HuixiangDou*", "gsc-vscode*", "example_projects*"]

# GSC roadmap 6.3: pytest markers — чтобы можно было селективно запускать
# subsets (`pytest -m unit`, `-m "not slow"`, `-m sandbox`).
[tool.pytest.ini_options]
# DD-10: enterprise-тест перенесён из enterprise/tests/ в tests/ (0.5.4 —
# тесты не должны жить внутри пакета и попадать в wheel).
testpaths = ["tests"]
markers = [
    "unit: fast unit tests, no external deps",
    "integration: require external services (docker/postgres/nuclei/network)",
    "sandbox: PoF sandbox isolation tests (require container runtime)",
    "cloud: multi-tenant cloud/SaaS tests",
    "slow: tests taking >10s",
    "smoke: registry/import smoke tests (fast, full-suite subset)",
]
