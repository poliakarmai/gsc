[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gsc-security"
version = "1.3.0"
description = "Git Security Checker — AI-powered SAST with 38 detectors, auto-PoC, and self-learning"
readme = "README.md"
license = {text = "BUSL-1.1"}
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31",
]
authors = [{name = "Alexey Polyakov", email = "poliakarmai@github.com"}]
keywords = ["security", "audit", "static-analysis", "sast", "sast-tool", "vulnerability-scanner", "appsec", "devsecops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
gsc = "gsc:main"

[project.optional-dependencies]
# Audit A-01: runtime surface split by extras — install what you need.
cli = ["httpx>=0.28", "uvicorn>=0.34"]
cloud = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.13",
    "httpx>=0.28",
    "python-jose[cryptography]>=3.5",
    "stripe>=12.0",
]
collector = ["Scrapy>=2.11"]
dev = ["pytest>=8", "pytest-cov>=5", "fakeredis>=2.23"]
all = ["gsc-security[cli,cloud,collector,dev]"]

[project.urls]
Homepage = "https://github.com/poliakarmai/gsc"
Repository = "https://github.com/poliakarmai/gsc.git"
Issues = "https://github.com/poliakarmai/gsc/issues"
Hall-of-Fame = "https://github.com/poliakarmai/gsc/blob/master/HALL_OF_FAME.md"

[tool.setuptools]
py-modules = ["gsc", "server"]

[tool.setuptools.packages.find]
include = ["gsc_detectors*", "cloud*", "gsc_collector*", "scripts*", "enterprise*"]
exclude = ["tests*", "benchmark*", "calibration*", "build*", "dist*", "OWASPBenchmark*", "HuixiangDou*", "gsc-vscode*", "example_projects*"]
