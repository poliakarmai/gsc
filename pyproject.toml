[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gsc"
version = "0.4.0"
description = "Git Security Checker — adaptive code audit with pattern learning"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []
authors = [{name = "poliakarmai"}]
keywords = ["security", "audit", "static-analysis", "sast", "lint"]
classifiers = [
    "Development Status :: 3 — Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
gsc = "gsc:main"

[project.urls]
Homepage = "https://github.com/poliakarmai/gsc"
Repository = "https://github.com/poliakarmai/gsc.git"
Issues = "https://github.com/poliakarmai/gsc/issues"

[tool.setuptools]
py-modules = ["gsc"]
